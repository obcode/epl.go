version: "2"

sql:
  - engine: postgresql
    # The schema comes from the goose migrations: one source of truth, rather than an
    # additionally maintained schema.sql that can drift away from them.
    schema: db/migrations
    queries: db/queries

    # For `sqlc vet`, not for `generate`: it prepares every query against a real database and
    # therefore finds what the built-in parser lets through — a typo in a column name, a cast
    # PostgreSQL resolves differently.
    #
    # `sqlc vet` needs a reachable database and so runs locally rather than in CI.
    # `analyzer.database: false` keeps `sqlc generate` free of that requirement: code
    # generation has to work without a running database, or a fresh clone cannot build.
    database:
      uri: "${TALLOX_DB_URL}"
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare

    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "citext"
            go_type: "string"

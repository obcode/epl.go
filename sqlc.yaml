version: "2"

sql:
  - engine: postgresql
    # Das Schema kommt aus den goose-Migrationen — eine einzige Quelle der Wahrheit, statt
    # einer zusätzlich gepflegten schema.sql, die auseinanderlaufen kann.
    schema: db/migrations
    queries: db/queries
    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "citext"
            go_type: "string"

rules:
  - sqlc/db-prepare

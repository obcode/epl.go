version: "2"

sql:
  - engine: postgresql
    # Das Schema kommt aus den goose-Migrationen — eine einzige Quelle der Wahrheit, statt
    # einer zusätzlich gepflegten schema.sql, die auseinanderlaufen kann.
    schema: db/migrations
    queries: db/queries

    # Für `sqlc vet` (nicht für `generate`): bereitet jede Query gegen eine echte Datenbank
    # vor und findet damit, was der eingebaute Parser durchlässt — ein Tippfehler in einem
    # Spaltennamen, ein Cast, den PostgreSQL anders auflöst.
    #
    # `sqlc vet` braucht eine erreichbare Datenbank und läuft deshalb nur lokal, nicht in der
    # CI. `analyzer.database: false` hält `sqlc generate` davon frei: Codegenerierung muss
    # ohne laufende Datenbank funktionieren, sonst kann ein frischer Klon nichts bauen.
    database:
      uri: "${TALLOX_DB_URL}"
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare

    gen:
      go:
        package: store
        out: internal/store
        sql_package: pgx/v5
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type: "github.com/google/uuid.NullUUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "citext"
            go_type: "string"

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=10m

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: epl
          POSTGRES_PASSWORD: epl
          POSTGRES_DB: epl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U epl -d epl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EPL_TEST_DB_URL: postgres://epl:epl@127.0.0.1:5432/epl_test?sslmode=disable
      # Ohne das würden Integrationstests bei einem DB-Problem still übersprungen — "grün"
      # und "nie gelaufen" sähen dann gleich aus.
      EPL_TEST_DB_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -race -v ./...

  release:
    needs: [lint, test]
    # Feature-Gate wie beim Deploy: erst auf true stellen, wenn das Secret RELEASE_TOKEN
    # angelegt ist. secrets lassen sich in einem job-level `if` nicht auswerten, deshalb
    # eine Repo-Variable. Bis dahin bleibt die Pipeline grün, statt bei jedem Push an einer
    # fehlenden Konfiguration zu scheitern.
    if: ${{ github.ref == 'refs/heads/main' && vars.RELEASE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: go-semantic-release/action@v1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          changelog-generator-opt: "emojis=true"

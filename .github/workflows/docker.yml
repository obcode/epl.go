name: docker

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.event.release.tag_name }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ github.event.release.published_at }}

  dispatch-deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # Die Deploy-Artefakte liegen im privaten Repo epl.dev. Statt sie hier zu spiegeln,
      # löst der Release dort einen Workflow aus. DISPATCH_TOKEN ist ein fine-grained PAT
      # mit ausschließlich "contents: write" auf obcode/epl.dev.
      - name: Deploy in epl.dev auslösen
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          gh api repos/obcode/epl.dev/dispatches \
            -f event_type=deploy-api \
            -F "client_payload[tag]=${{ github.event.release.tag_name }}"

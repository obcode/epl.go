version: 2

# Version updates for all three sources of third-party code in this repository: Go
# modules, actions in the pipeline, base images in the Dockerfile.
#
# The commit-message prefixes are not cosmetic: go-semantic-release derives the release
# from them (see ci.yml, job `release`). A `chore` produces no release — and without a
# release docker.yml builds no image and dispatches no deploy. Anything that has to reach
# the server therefore has to be a `fix`.

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # A grace period: a freshly published module should not land in go.sum the same day.
    # The proxy and sum.golang.org protect against a version being tampered with after
    # the fact, not against one that is malicious from the start — only distance helps
    # with that. Majors get longer, because the mistakes in a .0 release need time to
    # surface.
    cooldown:
      default-days: 3
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    # Go has no dev dependencies — everything here ends up in the binary. Hence `fix`:
    # a security fix should roll all the way out rather than sit in main.
    commit-message:
      prefix: fix(deps)
    groups:
      # One PR instead of ten. Majors stay separate on purpose — those want reading.
      go-modules:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Actions have no SemVer, so only default-days applies. A subverted action is the
    # classic way into a CI pipeline — a week of distance is cheap.
    cooldown:
      default-days: 7
    # Changes the pipeline, not the shipped artefact → no release.
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Docker tags have no SemVer, so only default-days applies.
    cooldown:
      default-days: 7
    # The base image is part of the shipped image → a patch release, so that it actually
    # gets rebuilt and rolled out. That is also why the runtime stage in the Dockerfile is
    # pinned to a patch version rather than to `latest`.
    commit-message:
      prefix: fix(docker)
    groups:
      docker-images:
        patterns: ["*"]
        update-types: [minor, patch]

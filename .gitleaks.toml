# gitleaks configuration for tallox.go
#
# Extends the upstream default ruleset and adds the Tallox Personal Access Token format.
# The realistic leak path is not the server — it is a colleague pasting their evaluation
# script, token and all, into a commit. This rule costs nothing and catches that.

[extend]
useDefault = true

[[rules]]
id = "tallox-personal-access-token"
description = "Tallox Personal Access Token"
# tallox_<16 chars Crockford base32, uppercase>_<43 chars base64url>
regex = '''tallox_[0-9A-HJKMNP-TV-Z]{16}_[A-Za-z0-9_-]{43}'''
tags = ["tallox", "token"]

[rules.allowlist]
# Documentation and tests deliberately show the shape of a token. Anything that is all
# A's or literally says "example"/"nonsense" is not a real secret.
regexTarget = "match"
regexes = [
  '''tallox_A{16}_''',
  '''tallox_[0-9A-HJKMNP-TV-Z]{16}_(example|nonsense|xxx)''',
]
